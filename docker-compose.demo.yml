# Local demo stack: Qdrant + API, with the LLM served by Ollama running natively on the host (Metal GPU).
#   docker compose -f docker-compose.demo.yml up -d --build
# Differences from docker-compose.yml:
#   - reuses the pre-built ai-cdss-api image (see ai/Dockerfile.demo)
#   - Qdrant 1.16 (matches qdrant-client 1.16 in the image); the qdrant image has no curl, so it uses a TCP healthcheck
#   - local MiniLM embeddings + Ollama llama3.2 on the host, models cached under ai/data/hf_cache
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: ai-cdss-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./ai
      dockerfile: Dockerfile.demo
    image: ai-cdss-api:demo
    container_name: ai-cdss-api
    ports:
      - "8000:8000"
    volumes:
      - ./ai/app:/app/app
      - ./ai/data:/app/data
      - ./ai/data.parquet:/app/data.parquet:ro
      - ./ai/.env:/app/.env:ro
    environment:
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_HOST=http://host.docker.internal:11434
      - HF_HOME=/app/data/hf_cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      qdrant:
        condition: service_healthy
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000

volumes:
  qdrant_storage:
